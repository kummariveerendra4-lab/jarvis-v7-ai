
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS V7</title>
<style>
body{font-family:Arial,sans-serif;background:#10131b;color:#fff;margin:0;padding:20px}
main{max-width:600px;margin:auto}
h1{color:#66d9ff}
#chat{height:55vh;overflow:auto;border:1px solid #444;border-radius:12px;padding:12px}
p{padding:10px;background:#202737;border-radius:8px;overflow-wrap:anywhere}
input,button{font-size:16px;padding:12px;border-radius:8px;margin-top:8px}
input{box-sizing:border-box;width:100%}
button{background:#087fa5;color:white;border:0}
small{color:#bbb}
</style>
</head>
<body>
<main>
<h1>JARVIS V7</h1>
<small>Personal assistant • Mobile edition</small>
<div id="chat" aria-live="polite">
<p><b>JARVIS:</b> Hello! I'm ready. This interface needs a secure backend to use real AI.</p>
</div>
<form id="form">
<input id="message" placeholder="Ask JARVIS something..." autocomplete="off" required>
<button type="submit">Send</button>
<button type="button" id="mic">🎙️ Speak</button>
</form>
</main>
<script>
const form = document.getElementById('form');
const messageInput = document.getElementById('message');
const chat = document.getElementById('chat');

function addMessage(sender, text) {
    const item = document.createElement('p');
    item.textContent = sender + ': ' + text;
    chat.appendChild(item);
    chat.scrollTop = chat.scrollHeight;
}

function speak(text) {
    if (!('speechSynthesis' in window)) {
        addMessage('JARVIS', 'Speech is not supported in this browser.');
        return;
    }

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-IN';
    utterance.rate = 1;
    window.speechSynthesis.speak(utterance);
}

form.addEventListener('submit', async function(event) {
    event.preventDefault();

    const message = messageInput.value.trim();
    if (!message) return;

    addMessage('You', message);
    messageInput.value = '';

    try {
        const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
        });

        const data = await response.json();
        const reply = data.reply || data.error ||
            'I could not get a response.';

        addMessage('JARVIS', reply);
        speak(reply);
    } catch (error) {
        addMessage('JARVIS', 'I cannot connect to the server right now.');
    }
});

const micButton = document.getElementById('mic');

if (micButton) {
    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    micButton.addEventListener('click', function() {
        if (!SpeechRecognition) {
            addMessage('JARVIS',
                'Voice recognition is not supported in this browser.');
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-IN';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = function(event) {
            messageInput.value =
                event.results[0][0].transcript;
            form.requestSubmit();
        };

        recognition.onerror = function() {
            addMessage('JARVIS',
                'Microphone error. Check browser microphone permission.');
        };

        recognition.start();
    });
}
</script>
</body>
</html>
